<svg xmlns="http://www.w3.org/2000/svg" width="2760" height="2670" viewBox="0 0 2760 2670" role="img" aria-labelledby="title desc"><title id="title">Frozen results and hosted PDF regressions</title><desc id="desc">Source-audited FilesMagic Security Engine poster figure.</desc><rect width="100%" height="100%" fill="#FFFFFF"/><style>text{font-family:Arial, Helvetica, sans-serif;fill:#202124}.t{font-size:88px;font-weight:700}.h{font-size:50px;font-weight:700}.b{font-size:38px}.s{font-size:30px;fill:#68727C}.xs{font-size:26px;fill:#68727C}.line{stroke:#68727C;stroke-width:7;fill:none}.red{stroke:#8F1D2C;stroke-width:10;fill:none}.box{fill:#E7EAED;stroke:#68727C;stroke-width:4}.pink{fill:#F7E8EA;stroke:#8F1D2C;stroke-width:5}.white{fill:#FFFFFF;stroke:#68727C;stroke-width:4}</style><text x="130" y="125" class="t" text-anchor="start">Results: frozen milestone + separate hosted PDF rescans</text><text x="130" y="180" class="s" text-anchor="start">The Nov. 9 evaluation and Nov. 14 regressions are different experiments and are not combined.</text><rect x="150" y="330" width="2460" height="1090" rx="22" class="pink"/><text x="1380.0" y="400" class="h" text-anchor="middle">Frozen standalone evaluation - Nov. 9</text><text x="1380.0" y="460" class="s" text-anchor="middle">offline Ubuntu VM; strict isolation; evaluated code eda2a08</text><text x="780" y="700" class="t" text-anchor="middle">114 / 114</text><text x="780" y="765" class="h" text-anchor="middle">expected scan outcomes</text><text x="1840" y="700" class="t" text-anchor="middle">11 / 11</text><text x="1840" y="765" class="h" text-anchor="middle">contribution checks</text><line x1="1380" y1="570" x2="1380" y2="870" class="line"/><text x="1380" y="1010" class="b" text-anchor="middle">Controlled checks, not a malware-detection accuracy percentage.</text><text x="1380" y="1110" class="b" text-anchor="middle">Every frozen result reported no missing required isolation control.</text><rect x="150" y="1580" width="2460" height="800" rx="22" class="white"/><text x="1380.0" y="1650" class="h" text-anchor="middle">Hosted research Lab rescans - Nov. 14</text><text x="1380.0" y="1710" class="s" text-anchor="middle">one SHA-256-matched rescan of each pinned qpdf fixture; unified engine; strict isolation reported</text><rect x="280" y="1880" width="980" height="250" rx="22" class="box"/><text x="770.0" y="1950" class="h" text-anchor="middle">V4-aes.pdf</text><text x="770.0" y="2010" class="s" text-anchor="middle">SAFE</text><text x="770.0" y="2049" class="s" text-anchor="middle">6 complete, 4 not applicable, 0 failed</text><rect x="1500" y="1880" width="980" height="250" rx="22" class="pink"/><text x="1990.0" y="1950" class="h" text-anchor="middle">bad-data.pdf</text><text x="1990.0" y="2010" class="s" text-anchor="middle">UNABLE TO SCAN</text><text x="1990.0" y="2049" class="s" text-anchor="middle">LZW content decoding failed</text><text x="1380" y="2260" class="s" text-anchor="middle">Evidence scope: two selected benign/parser-stress regressions; no repeated hosted trials or accuracy claim.</text></svg>