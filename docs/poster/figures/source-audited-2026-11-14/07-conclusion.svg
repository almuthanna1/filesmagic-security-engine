<svg xmlns="http://www.w3.org/2000/svg" width="2820" height="2190" viewBox="0 0 2820 2190" role="img" aria-labelledby="title desc"><title id="title">Research contributions and limitations</title><desc id="desc">Source-audited FilesMagic Security Engine poster figure.</desc><rect width="100%" height="100%" fill="#FFFFFF"/><style>text{font-family:Arial, Helvetica, sans-serif;fill:#202124}.t{font-size:108px;font-weight:700}.h{font-size:68px;font-weight:700}.b{font-size:50px}.s{font-size:38px;fill:#68727C}.xs{font-size:32px;fill:#68727C}.line{stroke:#68727C;stroke-width:9;fill:none}.red{stroke:#8F1D2C;stroke-width:13;fill:none}.box{fill:#E7EAED;stroke:#68727C;stroke-width:5}.pink{fill:#F7E8EA;stroke:#8F1D2C;stroke-width:6}.white{fill:#FFFFFF;stroke:#68727C;stroke-width:5}</style><text x="130" y="130" class="t" text-anchor="start">What this research shows - and does not</text><text x="130" y="220" class="s" text-anchor="start">Standalone static-analysis research prototype, not a production conversion gate.</text><rect x="150" y="360" width="1210" height="1300" rx="22" class="pink"/><text x="755.0" y="442" class="h" text-anchor="middle">Demonstrated</text><text x="755.0" y="512" class="s" text-anchor="middle">three source-backed contributions</text><rect x="1460" y="360" width="1210" height="1300" rx="22" class="white"/><text x="2065.0" y="442" class="h" text-anchor="middle">Still limited</text><text x="2065.0" y="512" class="s" text-anchor="middle">three essential boundaries</text><circle cx="245" cy="650" r="25" fill="#8F1D2C"/><text x="305" y="660" class="b" text-anchor="start">Contextual PDF chains separate</text><text x="305" y="720" class="b" text-anchor="start">unrelated from delivered attachments.</text><circle cx="245" cy="990" r="25" fill="#8F1D2C"/><text x="305" y="1000" class="b" text-anchor="start">Office/VBA analysis records</text><text x="305" y="1060" class="b" text-anchor="start">activation and call-path evidence.</text><circle cx="245" cy="1330" r="25" fill="#8F1D2C"/><text x="305" y="1340" class="b" text-anchor="start">Coverage gaps can fail closed</text><text x="305" y="1400" class="b" text-anchor="start">in the unified research engine.</text><circle cx="1555" cy="650" r="25" fill="#68727C"/><text x="1615" y="660" class="b" text-anchor="start">No production FilesMagic</text><text x="1615" y="720" class="b" text-anchor="start">converter integration.</text><circle cx="1555" cy="990" r="25" fill="#68727C"/><text x="1615" y="1000" class="b" text-anchor="start">No real-world malware-detection</text><text x="1615" y="1060" class="b" text-anchor="start">accuracy claim.</text><circle cx="1555" cy="1330" r="25" fill="#68727C"/><text x="1615" y="1340" class="b" text-anchor="start">No document execution; worker</text><text x="1615" y="1400" class="b" text-anchor="start">containment is not a full sandbox.</text><rect x="150" y="1820" width="2520" height="200" rx="22" class="box"/><text x="1410" y="1910" class="h" text-anchor="middle">Future production gate: SAFE + complete + required coverage + required isolation.</text><text x="1410" y="1970" class="s" text-anchor="middle">That integration is proposed, not implemented.</text></svg>