<svg xmlns="http://www.w3.org/2000/svg" width="6150" height="1380" viewBox="0 0 6150 1380" role="img" aria-labelledby="title desc"><title id="title">Implemented Security Engine workflow</title><desc id="desc">Source-audited FilesMagic Security Engine poster figure.</desc><rect width="100%" height="100%" fill="#FFFFFF"/><style>text{font-family:Arial, Helvetica, sans-serif;fill:#202124}.t{font-size:108px;font-weight:700}.h{font-size:68px;font-weight:700}.b{font-size:50px}.s{font-size:38px;fill:#68727C}.xs{font-size:32px;fill:#68727C}.line{stroke:#68727C;stroke-width:9;fill:none}.red{stroke:#8F1D2C;stroke-width:13;fill:none}.box{fill:#E7EAED;stroke:#68727C;stroke-width:5}.pink{fill:#F7E8EA;stroke:#8F1D2C;stroke-width:6}.white{fill:#FFFFFF;stroke:#68727C;stroke-width:5}</style><defs><marker id="n" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#68727C"/></marker><marker id="r" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#8F1D2C"/></marker></defs><text x="120" y="115" class="t" text-anchor="start">Implemented Security Engine workflow</text><text x="120" y="168" class="s" text-anchor="start">Standalone research service: it does not invoke the FilesMagic conversion service.</text><rect x="120" y="250" width="1100" height="840" rx="22" class="white"/><text x="670.0" y="332" class="h" text-anchor="middle">1  Upload</text><text x="670.0" y="402" class="s" text-anchor="middle">token, size, and hash checks</text><rect x="1510" y="250" width="1100" height="840" rx="22" class="pink"/><text x="2060.0" y="332" class="h" text-anchor="middle">2  Isolation</text><text x="2060.0" y="402" class="s" text-anchor="middle">fresh worker and strict Linux controls</text><rect x="2900" y="250" width="1460" height="840" rx="22" class="white"/><text x="3630.0" y="332" class="h" text-anchor="middle">3  Analysis</text><text x="3630.0" y="402" class="s" text-anchor="middle">reference, unified, and coverage checks</text><rect x="4650" y="250" width="1200" height="840" rx="22" class="pink"/><text x="5250.0" y="332" class="h" text-anchor="middle">4  Verdict</text><text x="5250.0" y="402" class="s" text-anchor="middle">findings plus completeness</text><path d="M1220 670 L1480 670" stroke="#68727C" stroke-width="7" fill="none" marker-end="url(#n)"/><path d="M2610 670 L2870 670" stroke="#8F1D2C" stroke-width="10" fill="none" marker-end="url(#r)"/><path d="M4390 670 L4620 670" stroke="#68727C" stroke-width="7" fill="none" marker-end="url(#n)"/><text x="670" y="810" class="b" text-anchor="middle">file bytes accepted</text><text x="670" y="870" class="b" text-anchor="middle">after authorization</text><text x="2060" y="810" class="b" text-anchor="middle">namespace, routes,</text><text x="2060" y="870" class="b" text-anchor="middle">capabilities, limits</text><rect x="3060" y="500" width="1140" height="165" rx="22" class="box"/><text x="3630.0" y="582" class="h" text-anchor="middle">Reference scanners</text><text x="3630.0" y="652" class="s" text-anchor="middle">signatures, PDF, Office, structural</text><rect x="3060" y="705" width="1140" height="165" rx="22" class="pink"/><text x="3630.0" y="787" class="h" text-anchor="middle">Unified research components</text><text x="3630.0" y="857" class="s" text-anchor="middle">chains, activation, fields, correlation</text><rect x="3060" y="910" width="1140" height="165" rx="22" class="box"/><text x="3630.0" y="992" class="h" text-anchor="middle">Coverage checks</text><text x="3630.0" y="1062" class="s" text-anchor="middle">required regions; fail closed</text><text x="5250" y="770" class="h" text-anchor="middle">SAFE</text><text x="5250" y="848" class="h" text-anchor="middle">SUSPICIOUS</text><text x="5250" y="926" class="h" text-anchor="middle">MALICIOUS</text><text x="5250" y="1004" class="h" text-anchor="middle">UNABLE TO SCAN</text><rect x="120" y="1130" width="5730" height="150" rx="20" class="box"/><text x="2985" y="1195" class="b" text-anchor="middle">Reference scanners remain the baseline; the research engine adds structured evidence and coverage handling.</text></svg>