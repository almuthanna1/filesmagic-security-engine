<svg xmlns="http://www.w3.org/2000/svg" width="2820" height="2370" viewBox="0 0 2820 2370" role="img" aria-labelledby="title desc"><title id="title">Document feature versus dangerous behavior</title><desc id="desc">Source-audited FilesMagic Security Engine poster figure.</desc><rect width="100%" height="100%" fill="#FFFFFF"/><style>text{font-family:Arial, Helvetica, sans-serif;fill:#202124}.t{font-size:108px;font-weight:700}.h{font-size:68px;font-weight:700}.b{font-size:50px}.s{font-size:38px;fill:#68727C}.xs{font-size:32px;fill:#68727C}.line{stroke:#68727C;stroke-width:9;fill:none}.red{stroke:#8F1D2C;stroke-width:13;fill:none}.box{fill:#E7EAED;stroke:#68727C;stroke-width:5}.pink{fill:#F7E8EA;stroke:#8F1D2C;stroke-width:6}.white{fill:#FFFFFF;stroke:#68727C;stroke-width:5}</style><defs><marker id="n" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#68727C"/></marker><marker id="r" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#8F1D2C"/></marker></defs><text x="140" y="145" class="t" text-anchor="start">Document features need context</text><text x="140" y="215" class="s" text-anchor="start">Static analysis asks whether an activation path is actually evidenced.</text><rect x="150" y="340" width="1160" height="1450" rx="22" class="white"/><text x="730.0" y="422" class="h" text-anchor="middle">Ordinary document features</text><text x="730.0" y="492" class="s" text-anchor="middle">often legitimate</text><rect x="280" y="600" width="900" height="190" rx="22" class="box"/><text x="730.0" y="682" class="h" text-anchor="middle">Form or link</text><text x="730.0" y="752" class="s" text-anchor="middle">a reader may choose to interact</text><rect x="280" y="920" width="900" height="190" rx="22" class="box"/><text x="730.0" y="1002" class="h" text-anchor="middle">Attachment</text><text x="730.0" y="1072" class="s" text-anchor="middle">may simply be present</text><rect x="280" y="1240" width="900" height="190" rx="22" class="box"/><text x="730.0" y="1322" class="h" text-anchor="middle">Macro or script</text><text x="730.0" y="1392" class="s" text-anchor="middle">may not be reached automatically</text><rect x="1510" y="340" width="1160" height="1450" rx="22" class="pink"/><text x="2090.0" y="422" class="h" text-anchor="middle">Potentially dangerous activation</text><text x="2090.0" y="492" class="s" text-anchor="middle">requires a proven path</text><rect x="1660" y="580" width="860" height="190" rx="22" class="white"/><text x="2090.0" y="662" class="h" text-anchor="middle">Automatic trigger</text><text x="2090.0" y="732" class="s" text-anchor="middle">on open / automatic entry</text><path d="M2090 790 L2090 905" stroke="#8F1D2C" stroke-width="10" fill="none" marker-end="url(#r)"/><rect x="1660" y="925" width="860" height="190" rx="22" class="white"/><text x="2090.0" y="1007" class="h" text-anchor="middle">Active step</text><text x="2090.0" y="1077" class="s" text-anchor="middle">script / procedure / relationship</text><path d="M2090 1135 L2090 1250" stroke="#8F1D2C" stroke-width="10" fill="none" marker-end="url(#r)"/><rect x="1660" y="1270" width="860" height="190" rx="22" class="white"/><text x="2090.0" y="1352" class="h" text-anchor="middle">Effect or delivery</text><text x="2090.0" y="1422" class="s" text-anchor="middle">launch / export / external load</text><rect x="150" y="1930" width="2520" height="230" rx="24" class="box"/><text x="1410" y="2025" class="h" text-anchor="middle">Presence alone is context. A verified path justifies a stronger finding.</text><text x="1410" y="2080" class="s" text-anchor="middle">SAFE means no known indicator found by completed analysis - not proof of harmlessness.</text></svg>