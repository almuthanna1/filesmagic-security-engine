<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1126" width="1500" height="1126" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Detection comparison matrix"><title>Detection comparison matrix</title><rect width="1500" height="1126" fill="#fcfcfb"/><text x="40.0" y="48.0" font-size="28" fill="#0b0b0b" font-weight="bold" text-anchor="start">Detection comparison: reference engine vs. unified engine</text><text x="40.0" y="80.0" font-size="17" fill="#52514e" font-weight="normal" text-anchor="start">16 inert synthetic fixtures, ground truth BENIGN; each scanned 20 times per engine with identical results every time. Verdicts, not accuracy.</text><text x="40.0" y="118.0" font-size="15" fill="#898781" font-weight="bold" text-anchor="start">Scenario / fixture</text><text x="520.0" y="118.0" font-size="15" fill="#898781" font-weight="bold" text-anchor="start">Reference (4 scanners)</text><text x="700.0" y="118.0" font-size="15" fill="#898781" font-weight="bold" text-anchor="start">Unified engine</text><text x="890.0" y="118.0" font-size="15" fill="#898781" font-weight="bold" text-anchor="start">What the unified engine changes</text><line x1="40" x2="1460" y1="130" y2="130" stroke="#c3c2b7" stroke-width="1"/><text x="40.0" y="158.0" font-size="18" fill="#0b0b0b" font-weight="bold" text-anchor="start">PDF without automatic code</text><text x="56.0" y="194.0" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">1  Clean PDF</text><rect x="520" y="174" width="150" height="30" rx="15" fill="#0ca30c"/><text x="595.0" y="195.0" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">SAFE</text><rect x="700" y="174" width="150" height="30" rx="15" fill="#0ca30c"/><text x="775.0" y="195.0" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">SAFE</text><text x="890.0" y="194.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">No findings in either engine.</text><text x="56.0" y="240.0" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">2  Form keystroke script</text><rect x="520" y="220" width="150" height="30" rx="15" fill="#fab219"/><text x="595.0" y="241.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><rect x="700" y="220" width="150" height="30" rx="15" fill="#fab219"/><text x="775.0" y="241.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><text x="890.0" y="240.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">False &#x27;automatic&#x27; claim removed; any script is still MEDIUM (PDF policy).</text><text x="56.0" y="286.0" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">2b  Open-at-page + click script</text><rect x="520" y="266" width="150" height="30" rx="15" fill="#fab219"/><text x="595.0" y="287.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><rect x="700" y="266" width="150" height="30" rx="15" fill="#fab219"/><text x="775.0" y="287.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><text x="890.0" y="286.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">False &#x27;automatic&#x27; claims removed (PDF scanner and YARA-X).</text><line x1="40" x2="1460" y1="308" y2="308" stroke="#c3c2b7" stroke-width="1"/><text x="40.0" y="336.0" font-size="18" fill="#0b0b0b" font-weight="bold" text-anchor="start">PDF with automatic JavaScript</text><text x="56.0" y="372.0" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">2c  Page-open script</text><rect x="520" y="352" width="150" height="30" rx="15" fill="#fab219"/><text x="595.0" y="373.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><rect x="700" y="352" width="150" height="30" rx="15" fill="#fab219"/><text x="775.0" y="373.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><text x="890.0" y="372.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">Kept: the page&#x27;s own /AA /O runs on open.</text><text x="56.0" y="418.0" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">3  #-escaped OpenAction script</text><rect x="520" y="398" width="150" height="30" rx="15" fill="#fab219"/><text x="595.0" y="419.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><rect x="700" y="398" width="150" height="30" rx="15" fill="#fab219"/><text x="775.0" y="419.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><text x="890.0" y="418.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">Automatic chain found through escaped names.</text><text x="56.0" y="464.0" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">4  Same, in object stream</text><rect x="520" y="444" width="150" height="30" rx="15" fill="#fab219"/><text x="595.0" y="465.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><rect x="700" y="444" width="150" height="30" rx="15" fill="#fab219"/><text x="775.0" y="465.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><text x="890.0" y="464.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">Automatic chain found inside a compressed object stream.</text><line x1="40" x2="1460" y1="486" y2="486" stroke="#c3c2b7" stroke-width="1"/><text x="40.0" y="514.0" font-size="18" fill="#0b0b0b" font-weight="bold" text-anchor="start">PDF script and attachment</text><rect x="30" y="522" width="1440" height="42" rx="6" fill="none" stroke="#0b0b0b" stroke-width="2"/><text x="56.0" y="550.0" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">5a  Auto script + unrelated file</text><rect x="520" y="530" width="150" height="30" rx="15" fill="#d03b3b"/><text x="595.0" y="551.0" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">MALICIOUS</text><rect x="700" y="530" width="150" height="30" rx="15" fill="#fab219"/><text x="775.0" y="551.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><text x="890.0" y="550.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="start">Verdict changed. Script never uses the attachment: no HIGH escalation.</text><text x="56.0" y="596.0" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">5b  Auto script exports file</text><rect x="520" y="576" width="150" height="30" rx="15" fill="#d03b3b"/><text x="595.0" y="597.0" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">MALICIOUS</text><rect x="700" y="576" width="150" height="30" rx="15" fill="#d03b3b"/><text x="775.0" y="597.0" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">MALICIOUS</text><text x="890.0" y="596.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">Same chain exports the attachment: HIGH, with the path as evidence.</text><line x1="40" x2="1460" y1="618" y2="618" stroke="#c3c2b7" stroke-width="1"/><text x="40.0" y="646.0" font-size="18" fill="#0b0b0b" font-weight="bold" text-anchor="start">Word external content</text><text x="56.0" y="682.0" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">6a  Hyperlink relationship</text><rect x="520" y="662" width="150" height="30" rx="15" fill="#0ca30c"/><text x="595.0" y="683.0" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">SAFE</text><rect x="700" y="662" width="150" height="30" rx="15" fill="#0ca30c"/><text x="775.0" y="683.0" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">SAFE</text><text x="890.0" y="682.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">Relationship no element references: recorded (INFO).</text><text x="56.0" y="728.0" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">6b  Unreferenced template</text><rect x="520" y="708" width="150" height="30" rx="15" fill="#fab219"/><text x="595.0" y="729.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><rect x="700" y="708" width="150" height="30" rx="15" fill="#fab219"/><text x="775.0" y="729.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><text x="890.0" y="728.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">Template relationship nothing references: kept, use not demonstrated.</text><text x="56.0" y="774.0" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">6c  Template via settings</text><rect x="520" y="754" width="150" height="30" rx="15" fill="#fab219"/><text x="595.0" y="775.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><rect x="700" y="754" width="150" height="30" rx="15" fill="#fab219"/><text x="775.0" y="775.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><text x="890.0" y="774.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">attachedTemplate confirmed with the full chain.</text><text x="56.0" y="820.0" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">6d  Linked picture (https)</text><rect x="520" y="800" width="150" height="30" rx="15" fill="#0ca30c"/><text x="595.0" y="821.0" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">SAFE</text><rect x="700" y="800" width="150" height="30" rx="15" fill="#0ca30c"/><text x="775.0" y="821.0" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">SAFE</text><text x="890.0" y="820.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">Recorded as INFO; not escalated (documented risk policy).</text><text x="56.0" y="866.0" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">6g  Linked picture (file://)</text><rect x="520" y="846" width="150" height="30" rx="15" fill="#fab219"/><text x="595.0" y="867.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><rect x="700" y="846" width="150" height="30" rx="15" fill="#fab219"/><text x="775.0" y="867.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><text x="890.0" y="866.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">Stays SUSPICIOUS: credential exposure (reference rule).</text><line x1="40" x2="1460" y1="888" y2="888" stroke="#c3c2b7" stroke-width="1"/><text x="40.0" y="916.0" font-size="18" fill="#0b0b0b" font-weight="bold" text-anchor="start">Word embedded objects and macros</text><text x="56.0" y="952.0" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">6e  Embedded object, shown</text><rect x="520" y="932" width="150" height="30" rx="15" fill="#fab219"/><text x="595.0" y="953.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><rect x="700" y="932" width="150" height="30" rx="15" fill="#fab219"/><text x="775.0" y="953.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><text x="890.0" y="952.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">Shown in the document; runs only when activated (INFO).</text><text x="56.0" y="998.0" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">6f  Embedded object, not shown</text><rect x="520" y="978" width="150" height="30" rx="15" fill="#fab219"/><text x="595.0" y="999.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><rect x="700" y="978" width="150" height="30" rx="15" fill="#fab219"/><text x="775.0" y="999.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><text x="890.0" y="998.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">Present but no element shows it (INFO).</text><text x="56.0" y="1044.0" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">7  Macro part, macro-free type</text><rect x="520" y="1024" width="150" height="30" rx="15" fill="#fab219"/><text x="595.0" y="1045.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><rect x="700" y="1024" width="150" height="30" rx="15" fill="#fab219"/><text x="775.0" y="1045.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><text x="890.0" y="1044.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">Macro call graph undetermined: the placeholder part is not a VBA project.</text><text x="40.0" y="1100.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">Outlined row: the only verdict that differs. All other changes are evidence: findings added, superseded or qualified (see comparison.md).</text></svg>
