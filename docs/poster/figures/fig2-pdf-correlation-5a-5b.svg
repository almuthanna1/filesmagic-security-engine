<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 640" width="1500" height="640" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="PDF correlation comparison, cases 5a and 5b"><title>PDF correlation comparison, cases 5a and 5b</title><rect width="1500" height="640" fill="#fcfcfb"/><text x="40.0" y="48.0" font-size="28" fill="#0b0b0b" font-weight="bold" text-anchor="start">Why 5a and 5b get different verdicts: evidence must share one action chain</text><text x="40.0" y="80.0" font-size="17" fill="#52514e" font-weight="normal" text-anchor="start">Both PDFs: an /OpenAction JavaScript action and one embedded text file. They differ only in whether the script names that file.</text><text x="40.0" y="130.0" font-size="22" fill="#0b0b0b" font-weight="bold" text-anchor="start">5a: Auto script + unrelated file</text><rect x="40" y="160" width="200" height="74" rx="8" fill="#eef3fb" stroke="#2a78d6" stroke-width="2"/><text x="140.0" y="191.0" font-size="16" fill="#0b0b0b" font-weight="bold" text-anchor="middle">catalog /OpenAction</text><text x="140.0" y="215.0" font-size="13" fill="#52514e" font-weight="normal" text-anchor="middle">trigger: document opens</text><rect x="290" y="160" width="200" height="74" rx="8" fill="#eef3fb" stroke="#2a78d6" stroke-width="2"/><text x="390.0" y="191.0" font-size="16" fill="#0b0b0b" font-weight="bold" text-anchor="middle">JavaScript action</text><text x="390.0" y="215.0" font-size="13" fill="#52514e" font-weight="normal" text-anchor="middle">app.alert(1)</text><rect x="540" y="160" width="200" height="74" rx="8" fill="#eef3fb" stroke="#2a78d6" stroke-width="2"/><text x="640.0" y="191.0" font-size="16" fill="#0b0b0b" font-weight="bold" text-anchor="middle">embedded file &#x27;f&#x27;</text><text x="640.0" y="215.0" font-size="13" fill="#52514e" font-weight="normal" text-anchor="middle">notes.txt (inert text)</text><line x1="240" y1="197" x2="284" y2="197" stroke="#0b0b0b" stroke-width="2"/><path d="M278 191 L288 197 L278 203 Z" fill="#0b0b0b"/><line x1="490" y1="197" x2="538" y2="197" stroke="#898781" stroke-width="2" stroke-dasharray="6 5"/><text x="515.0" y="258.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle">no link: the script never names &#x27;f&#x27;</text><text x="40.0" y="320.0" font-size="16" fill="#898781" font-weight="bold" text-anchor="start">Reference PDF scanner (co-occurrence anywhere in the file)</text><text x="40.0" y="348.0" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">PDF_AUTO_JAVASCRIPT_WITH_PAYLOAD  HIGH</text><rect x="40" y="362" width="170" height="30" rx="15" fill="#d03b3b"/><text x="125.0" y="383.0" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">MALICIOUS</text><text x="40.0" y="440.0" font-size="16" fill="#898781" font-weight="bold" text-anchor="start">Unified engine (same action chain required)</text><text x="40.0" y="468.0" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">ENGINE_PDF_AUTO_CHAIN_SCRIPT  MEDIUM</text><rect x="40" y="482" width="170" height="30" rx="15" fill="#fab219"/><text x="125.0" y="503.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">SUSPICIOUS</text><text x="780.0" y="130.0" font-size="22" fill="#0b0b0b" font-weight="bold" text-anchor="start">5b: Auto script exports file</text><rect x="780" y="160" width="200" height="74" rx="8" fill="#eef3fb" stroke="#2a78d6" stroke-width="2"/><text x="880.0" y="191.0" font-size="16" fill="#0b0b0b" font-weight="bold" text-anchor="middle">catalog /OpenAction</text><text x="880.0" y="215.0" font-size="13" fill="#52514e" font-weight="normal" text-anchor="middle">trigger: document opens</text><rect x="1030" y="160" width="200" height="74" rx="8" fill="#eef3fb" stroke="#2a78d6" stroke-width="2"/><text x="1130.0" y="191.0" font-size="16" fill="#0b0b0b" font-weight="bold" text-anchor="middle">JavaScript action</text><text x="1130.0" y="215.0" font-size="13" fill="#52514e" font-weight="normal" text-anchor="middle">exportDataObject({cName: &quot;f&quot;})</text><rect x="1280" y="160" width="200" height="74" rx="8" fill="#eef3fb" stroke="#2a78d6" stroke-width="2"/><text x="1380.0" y="191.0" font-size="16" fill="#0b0b0b" font-weight="bold" text-anchor="middle">embedded file &#x27;f&#x27;</text><text x="1380.0" y="215.0" font-size="13" fill="#52514e" font-weight="normal" text-anchor="middle">notes.txt (inert text)</text><line x1="980" y1="197" x2="1024" y2="197" stroke="#0b0b0b" stroke-width="2"/><path d="M1018 191 L1028 197 L1018 203 Z" fill="#0b0b0b"/><line x1="1230" y1="197" x2="1274" y2="197" stroke="#0b0b0b" stroke-width="3"/><path d="M1268 190 L1279 197 L1268 204 Z" fill="#0b0b0b"/><text x="1255.0" y="258.0" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">same chain: the script exports &#x27;f&#x27;</text><text x="780.0" y="320.0" font-size="16" fill="#898781" font-weight="bold" text-anchor="start">Reference PDF scanner (co-occurrence anywhere in the file)</text><text x="780.0" y="348.0" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">PDF_AUTO_JAVASCRIPT_WITH_PAYLOAD  HIGH</text><rect x="780" y="362" width="170" height="30" rx="15" fill="#d03b3b"/><text x="865.0" y="383.0" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">MALICIOUS</text><text x="780.0" y="440.0" font-size="16" fill="#898781" font-weight="bold" text-anchor="start">Unified engine (same action chain required)</text><text x="780.0" y="468.0" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">ENGINE_PDF_AUTO_CHAIN_DELIVERS_ATTACHMENT  HIGH</text><rect x="780" y="482" width="170" height="30" rx="15" fill="#d03b3b"/><text x="865.0" y="503.0" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">MALICIOUS</text><text x="40.0" y="610.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">Rule IDs and verdicts as recorded in the frozen runs. Severity policy: HIGH -&gt; MALICIOUS, LOW/MEDIUM -&gt; SUSPICIOUS (app/decision).</text></svg>
